name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --verbose --coverage

      - name: Upload coverage artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v5
        with:
          name: test-coverage
          path: coverage/
          retention-days: 14

  # Persona & golden-set compliance gate.
  # Runs the bundled persona-guardrail checks as an independent, fast gate so a
  # regression in the 250-sample golden set or the persona guards fails the build
  # immediately and is visible separately from the full test job.
  persona-gate:
    name: Persona & Golden-Set Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Persona & golden-set gate
        run: npm run test:persona

      - name: Verdict gate (retrieval + policy regression)
        run: npm run test:verdicts
