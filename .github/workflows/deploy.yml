name: Deploy (Vercel)

# Deploys the serverless function to Vercel after every merge to main, using
# the VERCEL_KEY repository secret (a Vercel deploy token). The deploy runs
# only after the same gates CI enforces, so a red build never ships.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_KEY  - a Vercel token scoped to the project (Account Settings ->
#                 Tokens, or created per-project under Project Settings ->
#                 Git Integration). Stored under this name; the workflow does
#                 not read any other name.
#
# Four deployment values are also required, and are validated before any build
# or deploy (npm run secrets:gate):
#   ADMIN_API_KEY          - 32+ characters, random (openssl rand -base64 48)
#   RECORD_ENCRYPTION_KEY  - 32+ characters, random, different from the others
#   LLM_API_KEY            - provider key, 20+ characters, not a template
#   TEXAS_LICENSE_NUMBER   - verified TDI number; a repository variable is fine
# The gate refuses each value's placeholders by shape: "your-api-key-here" and
# "sk-test..." for the model key, the pending sentinel / letters / repeated or
# sequential digits for the license. The deployed function refuses to start
# without the admin key, the record key and the license, and a production
# deploy without an LLM key would serve only the static fallback — so a missing
# or weak value is rejected here rather than discovered by the post-deploy
# smoke check.
#
# The two secrets the runtime cannot start without — ADMIN_API_KEY and
# RECORD_ENCRYPTION_KEY — are then written into the Vercel project's production
# environment before the deploy, from the same repository secrets the gate
# validated. Vercel values are write-only, so pushing the checked copy is the
# only way to guarantee the deployed value is the checked value; without it the
# two stores could drift and nothing would notice. LLM_API_KEY is not pushed
# (the runtime treats it as optional) and TEXAS_LICENSE_NUMBER is public project
# configuration, so neither is duplicated into the workflow's Vercel sync.
#
# VERCEL_ORG_ID and VERCEL_PROJECT_ID identify the project that receives the
# secrets and the deploy, and both are required whenever VERCEL_KEY is set.
# The sync addresses the project explicitly instead of letting the CLI infer a
# link from the checkout: storing a secret in the wrong project would leave the
# function that is being deployed running whatever value it already had.
#
# The first step is the enable switch and the completeness check in one place.
# If VERCEL_KEY is absent the pipeline is treated as disabled and the job skips
# itself, so forks and pre-secret states stay green. If it is present, every
# other name above must be too; a single missing value fails the run before
# install or build and names everything that is absent, instead of letting the
# gap surface later as a skipped step, a partial gate message, or a function
# that cannot start.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # workflow_run gives no permissions by default; deploy needs none beyond
    # the checkout.
    permissions:
      contents: read
    # Only deploy successful CI runs on main that came from a push (not a
    # dependency dashboard or other actor).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    steps:
      # The pipeline is enabled by VERCEL_KEY. Once it is set, every value the
      # deploy depends on must be present too: a missing key would otherwise
      # only surface later (as a skipped step, a failed gate message, or a
      # function that cannot start), and the run would look like a partial
      # success. This step names everything that is absent in one place, before
      # any time is spent on install and build.
      - name: Check deploy configuration
        id: config
        env:
          VERCEL_KEY: ${{ secrets.VERCEL_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RECORD_ENCRYPTION_KEY: ${{ secrets.RECORD_ENCRYPTION_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # The license is public: a repository variable is preferred, but an
          # existing secret keeps working.
          TEXAS_LICENSE_NUMBER: ${{ vars.TEXAS_LICENSE_NUMBER || secrets.TEXAS_LICENSE_NUMBER }}
        run: |
          if [ -z "$VERCEL_KEY" ]; then
            echo "VERCEL_KEY is not set — the deploy pipeline is disabled; skipping (add the repository secret to enable it)."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

          missing=""
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID ADMIN_API_KEY RECORD_ENCRYPTION_KEY LLM_API_KEY TEXAS_LICENSE_NUMBER; do
            if [ -z "${!name:-}" ]; then
              missing="${missing:+$missing }$name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::The deploy pipeline is enabled (VERCEL_KEY is set) but required configuration is missing: $missing"
            echo "::error::Add each missing name under Settings -> Secrets and variables -> Actions. TEXAS_LICENSE_NUMBER may be a repository variable. The run stops here rather than deploying with absent or unchecked values."
            exit 1
          fi

          echo "Deploy configuration complete: token, project pin, both runtime secrets, model key, and license are all present."

      - name: Checkout repository
        if: steps.config.outputs.available == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Deploy exactly the commit CI validated, not whatever main has
          # moved to since the workflow started.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        if: steps.config.outputs.available == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.available == 'true'
        run: npm ci

      # Pre-deploy posture gate: the runtime refuses to start in production
      # without a strong ADMIN_API_KEY, RECORD_ENCRYPTION_KEY and verified
      # TEXAS_LICENSE_NUMBER (src/index.ts), and an LLM-less deploy would serve
      # only the static fallback — so stop here instead of shipping a build
      # that cannot do its job. The report prints length and shape only, never
      # a value.
      - name: Pre-deploy posture gate (secrets + license)
        if: steps.config.outputs.available == 'true'
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RECORD_ENCRYPTION_KEY: ${{ secrets.RECORD_ENCRYPTION_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # The license is public: accept a repository variable (preferred) or
          # an existing secret, so either configuration keeps working.
          TEXAS_LICENSE_NUMBER: ${{ vars.TEXAS_LICENSE_NUMBER || secrets.TEXAS_LICENSE_NUMBER }}
        run: npm run secrets:gate

      # Audited before the CLI is installed: the gate is about the tree that
      # ships, not about the deploy tool's own transitive dependencies.
      - name: Dependency vulnerability audit
        if: steps.config.outputs.available == 'true'
        run: npm run audit

      # The CLI is pinned to an exact version. `vercel@latest` meant the deploy
      # pipeline could change without a commit, so a broken or compromised
      # release would ship with no review. Bump this deliberately, the way a
      # dependency change is reviewed.
      - name: Install pinned Vercel CLI
        if: steps.config.outputs.available == 'true'
        run: npm install --no-save vercel@64.7.0

      - name: Lint
        if: steps.config.outputs.available == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.config.outputs.available == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.config.outputs.available == 'true'
        run: npm run build

      # The gate checked the repository copy of these two secrets; this step
      # writes that same copy into the project the deploy will use. The script
      # sends each value over stdin (never argv), stores it as a Vercel Secret,
      # overwrites a stale value, and logs only the name and length.
      - name: Sync validated secrets to Vercel (production)
        if: steps.config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RECORD_ENCRYPTION_KEY: ${{ secrets.RECORD_ENCRYPTION_KEY }}
        run: bash scripts/sync-vercel-secrets.sh

      # The deployment is built by Vercel from `vercel.json` (installCommand,
      # buildCommand, includeFiles) — this job uploads source, not build output.
      # `--prebuilt` would be wrong here: it uploads only `.vercel/output`,
      # which is produced by `vercel build`, and nothing in this job runs that
      # command. The CLI rejects the deploy outright in that case ("no prebuilt
      # output found in .vercel/output"), so the flag would fail every run
      # before a single file is uploaded. The Build step above stays as a
      # parity gate: it is the same `npm run build` Vercel runs.
      - name: Deploy to Vercel (production)
        if: steps.config.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --no-install vercel deploy --prod --yes \
            --scope "$VERCEL_ORG_ID" \
            --project "$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' deploy.log | tail -1)
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
          echo "Deployed to $URL"

      - name: Smoke check the deployment
        if: steps.config.outputs.available == 'true'
        run: |
          test -n "$DEPLOY_URL" || { echo "No deploy URL captured"; exit 1; }
          echo "Probing $DEPLOY_URL/health"
          curl -fsS --max-time 30 "$DEPLOY_URL/health" | tee health.json
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL/widget.js")
          echo "widget.js HTTP $CODE"
          test "$CODE" = "200"

      - name: Deployment summary
        if: steps.config.outputs.available == 'true'
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "- **Commit:** ${{ github.event.workflow_run.head_sha }}"
            echo "- **URL:** $DEPLOY_URL"
            echo "- **Health check:** passed"
          } >> "$GITHUB_STEP_SUMMARY"
