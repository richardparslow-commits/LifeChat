version: 2

# SEC-17: routine dependency updates, grouped so the review queue stays small.
#
# Majors are excluded from these version updates on purpose (SEC-25): Express 5,
# Zod 4 and the TypeScript major need their own upgrade window and are not
# drive-by PRs. Dependabot's security updates are a separate channel and are not
# disabled by this ignore.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
      development-minor-patch:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
